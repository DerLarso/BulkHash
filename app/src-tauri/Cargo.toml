[package]
name = "BulkHash"
version = "0.1.0"
description = "Hashing :D"
authors = ["DerLarso"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bulk_hash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
blake3 = "1.8.7"
xxhash-rust = { version = "0.8.21", features = ["xxh3", "xxh64"] }
rayon = "1.12.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", features = ["serde"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize", "parallel"] }
base64 = "0.22"
flate2 = "1.1"
getrandom = "0.4"
zeroize = "1.9"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

